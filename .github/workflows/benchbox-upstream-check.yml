name: Check upstream SQLGlot tags

on:
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv run --no-project -- python -m downstream.refresh latest
